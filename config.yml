# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json

disableStartupPopups: true

gui:
    showCommandLog: true
    sidePanelWidth: 0.4

    # cyberdream muted theme
    border: rounded
    theme:
        activeBorderColor:
            - "#7ed8e8"
        inactiveBorderColor:
            - "#7b8496"
        searchingActiveBorderColor:
            - "#e878d8"
        optionsTextColor:
            - "#3c4048"
        selectedLineBgColor:
            - "#3c4048"
        cherryPickedCommitBgColor:
            - "#3c4048"
        cherryPickedCommitFgColor:
            - "#e878a8"
        unstagedChangesColor:
            - "#e3a875"
        defaultFgColor:
            - "#e7e7e7" # custom fg color
